# =====================================================
#  VeloTab v1.8.0 - Ultimate Suite
#  Creado por ItzUsman (itzusm.netlify.app)
# =====================================================

# Idioma del plugin (es / en)
language: es

# --- ACTUALIZACIONES ---
update_checker: true
auto_update: false

# --- SINCRONIZACION DE RED ---
network_sync:
  enable: true

# --- TABLIST (Header & Footer) ---
TabList:
  Enable: true
  Update_Interval: 20
  Header:
    - ""
    - "  {anim:server_name}  "
    - "&7Conectados: &b%server_online% &8| &7TPS: &b%server_tps%  "
    - ""
  Footer:
    - ""
    - "{anim:rainbow_footer}"
    - "&8tienda.lobomax.xyz"
    - ""
  
  # Formato para jugadores AFK (Requiere EssentialsX)
  AFK_Format: "&7[AFK] "
  
  # Prefijo para jugadores de Bedrock (Requiere Geyser)
  Bedrock_Prefix: "&7[BE] "

  # Objetivo en el Tab (Derecha del nombre)
  # Tipos: NONE, HEALTH, PING
  Objective:
    Type: "PING"

# --- SCOREBOARD ---
Scoreboard:
  Enable: true
  Title: "{anim:server_name}"
  Update_Interval: 20
  Lines:
    - "&8&m-------------------"
    - "&fNombre: &b%player_name%"
    - "&fRango: &b%luckperms_prefix%"
    - ""
    - "&fAsesinatos: &b%statistic_player_kills%"
    - "&fMuertes: &b%statistic_deaths%"
    - ""
    - "&fLatencia: &b%player_ping%ms"
    - "&fConectados: &b%server_online%"
    - ""
    - "&b  lobomax.xyz"
    - "&8&m-------------------"

# --- BOSSBAR ---
BossBar:
  Enable: false
  Update_Interval: 40
  Title: "&b&l¡Bienvenido a nuestro servidor!"
  Progress: 1.0
  Color: "BLUE" # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  Overlay: "PROGRESS" # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20

# --- ACTIONBAR ---
ActionBar:
  Enable: false
  Update_Interval: 20
  Text: "&7Coordenadas: &f%player_x%, %player_y%, %player_z% &8| &7Mundo: &f%player_world%"

# --- TAB HIDE (Seguridad) ---
# Esconde comandos del autocompletado basándose en permisos reales.
Tab_Hide:
  enable: true
  # Comandos que NUNCA se mostrarán (ni siquiera a OPs)
  force_hide:
    - "plugins"
    - "pl"
    - "version"
    - "ver"
    - "about"
  # Comandos que SIEMPRE se mostrarán
  always_show:
    - "help"
    - "spawn"

# --- ORDEN DE RANGOS (Sorting) ---
Sorting:
  Enable: true
  Groups:
    fundador: "01"
    admin: "02"
    mod: "03"
    vip: "04"
    user: "05"
    default: "99"

# --- FORMATO DE CHAT ---
Chat_Format:
  Enable: true
  Default_Format: '&8[%luckperms_prefix%&8] &7{player} &8» &7{message}'
  Player_Hover: |-
    &eInformacion de &b%player_name%&7:
    &fRango: %luckperms_prefix%
    &fPing: &a%player_ping%ms
    &7Haz click para enviarle un mensaje.
  Groups:
    admin: '&8[&cADMIN&8] %luckperms_prefix%&7{player} &8» &f{message}'
    user: '&8[&7USER&8] &7{player} &8» &7{message}'
