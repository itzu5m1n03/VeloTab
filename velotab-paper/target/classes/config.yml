  soporte: '&8[&dSOPORTE&8] %luckperms_prefix%&7{player} &8» &f{message}'
  postulante: '&8[&7POSTULANTE&8] %luckperms_prefix%&7{player} &8» &f{message}'
  partner: '&8[&5PARTNER&8] %luckperms_prefix%&7{player} &8» &f{message}'
  famoso: '&8[&5FAMOSO&8] %luckperms_prefix%&7{player} &8» &f{message}'
