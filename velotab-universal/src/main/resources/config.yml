#  Web: itzusm.netlify.app
# =====================================================

# Idioma del plugin (es / en)
language: es

# Comprobar actualizaciones automaticamente
update_checker: true

# --- SINCRONIZACION DE RED ---
network_sync:
  enable: true
  is_master: false # Solo poner en true en el Proxy (Velocity/Bungee)

# --- SEGURIDAD Y TAB ---
Tab_Hide:
  enable: true
  hide_prefixed_commands: true
  force_hide:
    - "plugins"
    - "pl"
    - "version"
    - "ver"
  always_show:
    - "msg"
    - "spawn"

# --- TABLIST (Header & Footer) ---
# Soporta MiniMessage (RGB/Gradientes) y PlaceholderAPI
TabList:
  Enable: true
  Update_Interval: 20
  Header:
    - "<gradient:#fbff00:#ff0000><bold>LOBOMAX.XYZ</bold></gradient>"
    - "&7¡Bienvenido &e%player_name%&7!"
  Footer:
    - "&7Jugadores: &e%bungee_total% &8| &7Ping: &e%player_ping%ms"
    - "<gold>itzusm.netlify.app</gold>"

# --- SCOREBOARD ---
# Diseño solicitado por ItzUsman
Scoreboard:
  Enable: true
  Title: "<gradient:#fbff00:#ff0000><bold>LOBOMAX</bold></gradient>"
  Lines:
    - "&7%server_time_dd/MM/yyyy%"
    - ""
    - "&fNombre: &a%player_name%"
    - "&fRango: %luckperms_prefix%"
    - ""
    - "&c⚔ Asesinatos: &f%statistic_player_kills%"
    - "&4☠ Muertes: &f%statistic_deaths%"
    - ""
    - "&fLatencia: &a%player_ping%ms"
    - "&fConectados: &a%bungee_total%"
    - ""
    - "&eLOBOMAX.XYZ"

# --- ORDEN DE RANGOS (Sorting) ---
# Los jugadores se ordenaran en el Tab segun su prioridad
Sorting:
  Enable: true
  Groups:
    fundador: "01"
    admin: "02"
    mod: "03"
    vip: "04"
    user: "05"
    default: "06"

# --- FORMATO DE CHAT ---
Chat_Format:
  Enable: true
  Default_Format: '&8[%luckperms_prefix%&8] &7{player} &8» &7{message}'
  # Al poner el raton sobre el nombre del jugador en el chat
  Player_Hover: "&eInformacion de &b%player_name%&7:\n&fRango: %luckperms_prefix%\n&fPing: &a%player_ping%ms"
  Groups:
    admin: '&8[&cADMIN&8] %luckperms_prefix%&7{player} &8» &f{message}'
    user: '&8[&7USER&8] &7{player} &8» &7{message}'
