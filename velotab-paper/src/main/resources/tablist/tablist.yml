# VeloTab - TabList Settings
Enable: true
Update_Interval: 20

# --- NAMETAGS PRO (Packet-Based) ---
# Crea líneas físicas arriba y abajo del nombre del jugador.
# Requiere ProtocolLib habilitado en config.yml
Nametags_Pro:
  Enable: false
  UpName: "&8[%luckperms_prefix%&8]"
  DownName: "&a%player_ping%ms"

# Formato por defecto
Default:
  Header:
    - ""
    - "  {anim:server_name}  "
    - "&7Conectados: &b%server_online% &8| &7TPS: &b%server_tps%  "
    - ""
  Footer:
    - ""
    - "{anim:rainbow_footer}"
    - "&8tienda.lobomax.xyz"
    - ""

# Formato para jugadores AFK
AFK_Format: "&7[AFK] "

# Prefijo para jugadores de Bedrock
Bedrock_Prefix: "&7[BE] "

# Objetivo en el Tab
Objective:
  Type: "PING"
