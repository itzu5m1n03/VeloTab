# Idioma del plugin (es / en)
language: es

# Comprobar actualizaciones automaticamente
update_checker: true

# --- SINCRONIZACION DE RED ---
# Si se activa en el Proxy, enviara la config a todos los servidores conectados.
# En los servidores de juego, esto permitira recibir la config del Proxy automaticamente.
network_sync:
  enable: true
  is_master: false # Solo poner en true en el Proxy (Velocity/Bungee)

# --- SEGURIDAD Y TAB ---
Tab_Hide:
  enable: true
  # Oculta comandos con prefijo (ej: litebans:warn)
  hide_prefixed_commands: true
  # Comandos ocultos permanentemente
  force_hide:
    - "plugins"
    - "pl"
    - "version"
    - "ver"
  # Comandos visibles siempre
  always_show:
    - "msg"
    - "spawn"

# --- TABLIST (Header & Footer) ---
# Soporta MiniMessage (RGB/Gradientes) y PlaceholderAPI
TabList:
  Enable: true
  Update_Interval: 20 # En ticks (20 = 1 segundo)
  Header:
    - "<gradient:#fbff00:#ff0000><bold>VELOTAB NETWORK</bold></gradient>"
    - "&7¡Bienvenido &e%player_name%&7!"
  Footer:
    - "&7Jugadores: &e%bungee_total% &8| &7Ping: &e%player_ping%ms"
    - "<gold>itzusm.netlify.app</gold>"

# --- SCOREBOARD ---
# Soporta animaciones y colores RGB
Scoreboard:
  Enable: true
  Title: "<gradient:#fbff00:#ff0000><bold>VELOTAB</bold></gradient>"
  Lines:
    - "&8&m-------------------"
    - "&fNombre: &e%player_name%"
    - "&fRango: %luckperms_prefix%"
    - ""
    - "&fLatencia: &e%player_ping%ms"
    - "&fConectados: &e%bungee_total%"
    - ""
    - "&eitzusm.netlify.app"
    - "&8&m-------------------"

# --- ORDEN DE RANGOS (Sorting) ---
# Determina el orden en el que aparecen los jugadores en el TabList.
Sorting:
  Enable: true
  # Formato: "nombre_grupo:prioridad" (Menor numero = mas arriba)
  Groups:
    fundador: "01"
    admin: "02"
    mod: "03"
    vip: "04"
    user: "05"
    default: "06"

# --- FORMATO DE CHAT ---
Chat_Format:
  Enable: true
  Default_Format: '&8[%luckperms_prefix%&8] &7{player} &8» &7{message}'
  Groups:
    fundador: '&8[&4&lFUNDADOR&8] %luckperms_prefix%&7{player} &8» &f{message}'
    admin: '&8[&cADMIN&8] %luckperms_prefix%&7{player} &8» &f{message}'
    user: '&8[&7USER&8] &7{player} &8» &7{message}'
