# =====================================================
#  VeloTab (Paper) - LobboMax
# =====================================================

# --- AUTOCOMPLETADO (TAB) ---
# Oculta comandos del tab automaticamente segun el permiso REAL de cada
# comando (el mismo que revisa LuckPerms). No necesitas mantener listas
# manuales por rango. El permiso "velotab.bypass" ve todo sin filtrar.
Tab_Hide:
  enable: true
  # Comandos que quieres ocultar SIEMPRE (sin importar el permiso).
  force_hide:
    - "plugins"
    - "pl"
    - "version"
    - "ver"
    - "about"
    - "icanhasbukkit"
    - "help"
    - "?"
  # Comandos que NUNCA se ocultan, sin importar el permiso.
  always_show:
    - "msg"
    - "spawn"
    - "kit"
    - "warp"

# --- FORMATO DE CHAT ---
# Personaliza como se ve el chat por rango de LuckPerms.
# La clave debe ser EXACTAMENTE el nombre del grupo en LuckPerms
# (minusculas, tal cual aparece en tu export).
# Placeholders disponibles: {player}  {message}  %luckperms_prefix%  %luckperms_suffix%
# Si tienes PlaceholderAPI instalado, cualquier otro %placeholder% tambien
# se resuelve automaticamente (ej: %uclans_tag_color%).
Chat_Format:

  Enable: true

  # Se usa si el grupo del jugador no tiene un formato propio abajo.
  Default_Format: '&8[%luckperms_prefix%&8] &7{player} &8» &7{message}'

  fundador: '&8[&4&lFUNDADOR&8] %luckperms_prefix%&7{player} &8» &f{message}'
  co-fundador: '&8[&4CO-FUNDADOR&8] %luckperms_prefix%&7{player} &8» &f{message}'
  owner: '&8[&cOWNER&8] %luckperms_prefix%&7{player} &8» &f{message}'
  co-owner: '&8[&cCO-OWNER&8] %luckperms_prefix%&7{player} &8» &f{message}'
  head-manager: '&8[&6HEAD-MANAGER&8] %luckperms_prefix%&7{player} &8» &f{message}'
  manager: '&8[&6MANAGER&8] %luckperms_prefix%&7{player} &8» &f{message}'
  developer: '&8[&bDEVELOPER&8] %luckperms_prefix%&7{player} &8» &f{message}'
  builder: '&8[&aBUILDER&8] %luckperms_prefix%&7{player} &8» &f{message}'
  admin: '&8[&cADMIN&8] %luckperms_prefix%&7{player} &8» &f{message}'
  admin-jr: '&8[&cADMIN-JR&8] %luckperms_prefix%&7{player} &8» &f{message}'
  head-mod: '&8[&9HEAD-MOD&8] %luckperms_prefix%&7{player} &8» &f{message}'
  senior-mod: '&8[&9SENIOR-MOD&8] %luckperms_prefix%&7{player} &8» &f{message}'
